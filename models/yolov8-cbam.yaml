# YOLOv8s-CBAM — YOLOv8 small backbone with a CBAM attention block inserted
# right after SPPF, before the features are split off to the detection neck.
#
# WHY THIS PLACEMENT: SPPF produces the backbone's final, richest feature map
# (P5) — the point where the network has assembled the most global context.
# Applying CBAM here lets the network re-weight "what matters" in that fully
# assembled representation before it's used for both the P5 detection head
# and (via upsampling) the P4/P3 heads — so the attention refinement benefits
# all three detection scales, not just one.
#
# This is a single-CBAM variant (simpler, lower risk of indexing errors than
# inserting CBAM after every backbone stage, which some published papers do).
# It's a legitimate, citable placement choice — if you want CBAM after each
# C2f stage too, that's a natural extension once this version is working.

nc: 1  # number of classes — 1 for single-class cow detection
scales:
  s: [0.33, 0.50, 1024]  # depth_multiple, width_multiple, max_channels (YOLOv8s scale)

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1 - P2/4
  - [-1, 3, C2f, [128, True]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3 - P3/8
  - [-1, 6, C2f, [256, True]]          # 4 - referenced by head (P3)
  - [-1, 1, Conv, [512, 3, 2]]         # 5 - P4/16
  - [-1, 6, C2f, [512, True]]          # 6 - referenced by head (P4)
  - [-1, 1, Conv, [1024, 3, 2]]        # 7 - P5/32
  - [-1, 3, C2f, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 1, CBAM, [512]]              # 10 - NEW: attention on final P5 features

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12 - cat backbone P4
  - [-1, 3, C2f, [512]]                           # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15 - cat backbone P3
  - [-1, 3, C2f, [256]]                           # 16 - P3/8-small (small objects)

  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, Concat, [1]]                    # 18 - cat head P4
  - [-1, 3, C2f, [512]]                           # 19 - P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, Concat, [1]]                    # 21 - cat CBAM-refined P5 (was SPPF, now CBAM output)
  - [-1, 3, C2f, [1024]]                          # 22 - P5/32-large

  - [[16, 19, 22], 1, Detect, [nc]]               # 23 - Detect(P3, P4, P5)
